# Copy to k8s/secret.local.yaml, replace every required value, then run
# `make k8s-secrets`. This template is never applied directly.
apiVersion: v1
kind: Secret
metadata:
  name: logfilter-secrets
  namespace: logfilter
type: Opaque
stringData:
  LOGFILTER_API_TOKEN: "REPLACE-ME"
  LOGFILTER_METRICS_TOKEN: "REPLACE-ME"
  ES_PASSWORD: "REPLACE-ME"
  QRADAR_GATEWAY_HMAC_SECRET: "REPLACE-ME"
  LOGFILTER_RESPONSE_GATEWAY_HMAC_SECRET: "REPLACE-ME"
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  KAFKA_SSL_PASSWORD: ""
