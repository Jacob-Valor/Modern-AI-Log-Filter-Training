# Required repository settings:
# - GitHub Packages/GHCR write access for this repository or organization.
# - GitHub Code Scanning enabled if SARIF upload results should appear in Security.
# - GitHub Actions OIDC enabled for Sigstore keyless cosign signing.
name: CD

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  publish-images:
    name: Build, scan, sign, and publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: logfilter-api
            dockerfile: docker/api/Dockerfile
          - service: logfilter-collector
            dockerfile: docker/collector/Dockerfile
          - service: logfilter-router
            dockerfile: docker/router/Dockerfile
          - service: logfilter-archive
            dockerfile: docker/archive/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Set image tag variable
        shell: bash
        run: |
          echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_ENV"

      - name: Generate SBOM artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        continue-on-error: true
        with:
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: warn

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Signing is a release gate: an unsigned image must never ship with a green
      # run, so no `continue-on-error` and no `|| true` here. A missing OIDC token
      # or an expired cosign identity fails the job.
      - name: Sign image digest with keyless cosign
        shell: bash
        env:
          IMAGE_DIGEST: ${{ env.IMAGE_TAG }}@${{ steps.build.outputs.digest }}
        run: |
          case "${IMAGE_DIGEST}" in
            *"@sha256:"*) ;;
            *)
              echo "::error::build-push-action reported no image digest; refusing to publish unsigned"
              exit 1
              ;;
          esac
          echo "Signing ${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Verify keyless signature
        shell: bash
        env:
          IMAGE_DIGEST: ${{ env.IMAGE_TAG }}@${{ steps.build.outputs.digest }}
        run: cosign verify "${IMAGE_DIGEST}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif