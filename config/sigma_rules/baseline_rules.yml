title: SQL Injection Pattern
id: e1a2b3c4-0001-4a11-8b11-000000000001
status: experimental
description: >
  Signature-based detection of common SQL injection substrings in web request
  logs. Represents the kind of static pattern a traditional rule-based SIEM
  (no ML) would ship out of the box.
logsource:
    category: application
detection:
    selection:
        CommandLine|contains:
            - "OR 1=1"
            - "or 1=1"
            - "UNION SELECT"
            - "union select"
            - "SQL injection"
    condition: selection
level: high
tags:
    - attack.initial_access
    - attack.t1190
---
title: Cross-Site Scripting (XSS) Pattern
id: e1a2b3c4-0002-4a11-8b11-000000000002
status: experimental
description: Static substring match for reflected/stored XSS payloads.
logsource:
    category: application
detection:
    selection:
        CommandLine|contains:
            - "<script>"
            - "onerror=alert"
            - "XSS attack"
    condition: selection
level: high
tags:
    - attack.initial_access
    - attack.t1190
