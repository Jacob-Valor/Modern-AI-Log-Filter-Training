apiVersion: apps/v1
kind: Deployment
metadata:
  name: logfilter-api
  namespace: logfilter
  labels:
    app.kubernetes.io/name: logfilter-api
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: logfilter-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logfilter-api
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: logfilter-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          env:
            - name: LOGFILTER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logfilter-secrets
                  key: LOGFILTER_API_TOKEN
            - name: LOGFILTER_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logfilter-secrets
                  key: LOGFILTER_METRICS_TOKEN
            - name: LOGFILTER_RESPONSE_GATEWAY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: logfilter-secrets
                  key: LOGFILTER_RESPONSE_GATEWAY_HMAC_SECRET
            - name: LOGFILTER_RESPONSE_MODE
              valueFrom:
                configMapKeyRef:
                  name: logfilter-config
                  key: LOGFILTER_RESPONSE_MODE
            - name: LOGFILTER_RESPONSE_KILL_SWITCH
              valueFrom:
                configMapKeyRef:
                  name: logfilter-config
                  key: LOGFILTER_RESPONSE_KILL_SWITCH
            - name: LOGFILTER_RESPONSE_ALLOWED_NETWORKS
              valueFrom:
                configMapKeyRef:
                  name: logfilter-config
                  key: LOGFILTER_RESPONSE_ALLOWED_NETWORKS
            - name: LOGFILTER_RESPONSE_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: logfilter-config
                  key: LOGFILTER_RESPONSE_ALLOWED_HOSTS
            - name: LOGFILTER_RESPONSE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: logfilter-config
                  key: LOGFILTER_RESPONSE_GATEWAY_URL
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logfilter-secrets
                  key: ES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "logfilter-kafka:9092"
            - name: ES_HOST
              value: "http://logfilter-elasticsearch:9200"
            - name: LOGFILTER_ENABLE_DOCS
              value: "0"
            - name: LOGFILTER_MODEL_VERSION
              value: "0.1.0"
            - name: LOGFILTER_MODELS_STRICT
              value: "1"
            - name: LOGFILTER_FLOW_ENABLED
              value: "true"
            - name: LOGFILTER_ENDPOINT_NOVELTY_ENABLED
              value: "true"
            - name: LOGFILTER_BOT_FLOW_ENABLED
              value: "false"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: logfilter-config
            # ConfigMap keys cannot contain "/", so the Sigma rules need an
            # explicit items projection to land at config/sigma_rules/.
            # Without this the Sigma corpus and the MITRE technique map are
            # absent in-cluster and both features silently do nothing under
            # Kubernetes while working under docker-compose.
            items:
              - key: config.yaml
                path: config.yaml
              - key: mitre_techniques.json
                path: mitre_techniques.json
              - key: sigma_rules_baseline_rules.yml
                path: sigma_rules/baseline_rules.yml
        - name: models
          persistentVolumeClaim:
            claimName: logfilter-models-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: logfilter-api
  namespace: logfilter
  labels:
    app.kubernetes.io/name: logfilter-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logfilter-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logfilter-api
  namespace: logfilter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logfilter-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
