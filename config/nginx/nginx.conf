upstream api {
    server logfilter-api:8080;
}

server {
    listen 8443 ssl;
    server_name localhost logfilter-api;

    ssl_certificate     /etc/tls/server.crt;
    ssl_certificate_key /etc/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;

    # Docker's embedded DNS. Used (instead of a static `upstream {}` block) so
    # nginx resolves these hostnames per-request rather than once at startup —
    # an optional/slow-starting container (e.g. kibana, which is behind the
    # "dev" compose profile) no longer takes down the whole reverse proxy with
    # "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_pass         http://api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api/health;
        access_log off;
    }

    location /grafana/ {
        set $grafana_upstream http://logfilter-grafana:3000;
        proxy_pass         $grafana_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /prometheus/ {
        set $prometheus_upstream http://logfilter-prometheus:9090/;
        proxy_pass         $prometheus_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /kibana/ {
        set $kibana_upstream http://logfilter-kibana:5601;
        proxy_pass         $kibana_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /jaeger/ {
        set $jaeger_upstream http://logfilter-jaeger:16686/;
        proxy_pass         $jaeger_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /alertmanager/ {
        set $alertmanager_upstream http://logfilter-alertmanager:9093/;
        proxy_pass         $alertmanager_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8080;
    server_name localhost;
    return 301 https://$host$request_uri;
}
